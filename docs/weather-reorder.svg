  .t-dim { fill: var(--ink-2); }
  .t-faint { fill: var(--ink-3); }
  .t-num { font-variant-numeric: tabular-nums; }
  .rule { stroke: var(--grid); stroke-width: 1; }
  </style>
  <rect width="900" height="354" fill="var(--surface)"/>
  <text x="24" y="30" font-size="16" font-weight="650">The forecast reorders the day</text>
  <text x="24" y="50" font-size="11.5" class="t-dim">Same park, same gallery, same appetite for both. Only the hours the rain falls in change.</text>
  <text x="24" y="82" font-size="12" font-weight="600">Dry morning, wet afternoon</text>

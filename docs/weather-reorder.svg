<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" width="900" height="354" role="img" aria-labelledby="t d">
  <title id="t">The same two candidates, reordered by the forecast</title>
  <desc id="d">Dry morning, wet afternoon: Parc de la Ciutadella, then Museu Picasso. Wet morning, dry afternoon: Museu Picasso, then Parc de la Ciutadella</desc>
  <style>
  :root {

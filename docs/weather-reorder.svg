    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #8a887f;
    --grid: #e6e5e0;
    --band: #eceae4;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --ramp-1: #dbe8f8;
    --ramp-2: #a9c8ee;
    --ramp-3: #6ba1e0;
    --ramp-4: #2a78d6;

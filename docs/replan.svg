<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 633" width="900" height="633" role="img" aria-labelledby="t d">
  <title id="t">The same day before and after two hours are lost</title>
  <desc id="d">running 2h late. 1 moved to another day and 4 retimed. Everything up to 11:00 on 2026-05-11 was left alone. Picking the plan back up at 13:00 on 2026-05-11.</desc>

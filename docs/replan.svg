  <text x="24" y="488" font-size="11" font-weight="600" class="t-dim">What the agent changed, and why</text>
  <text x="24" y="506" font-size="9" font-weight="700" style="fill:var(--s1)">MOVED</text>
  <text x="92" y="506" font-size="10.5" font-weight="600">Mercat de la Boqueria</text>
  <text x="320" y="506" font-size="10.5" class="t-dim">moved to 2026-05-13 at 18:35, where it fits</text>
